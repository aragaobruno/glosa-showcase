# Mantém a demo da GLOSA acordada (o plano gratuito do Render dorme após 15 min sem acesso).
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Acessa a demo
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://glosa-4tap.onrender.com/demo) && echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Demo não respondeu 200 após 3 tentativas"; exit 1
